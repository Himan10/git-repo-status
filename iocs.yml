# Known indicators of compromise (IOCs) from published GitHub Actions supply-chain campaigns.
#
# Repo Status checks every scan against this file. Most checks use data the scan already has; the
# self-hosted runner names cost one call per repository.
#
# Adding a campaign: one entry per campaign, with its date, at least one source link, and only
# indicators copied from those sources. A wrong indicator is worse than none. Generic names (such as
# a workflow called security-audit.yml) must be combined with something specific (only_if_contains),
# so ordinary workflows with the same name are not flagged.
#
# What each field is matched against:
#   workflow_files           path of a workflow file on any branch, or of a workflow that ran (path:, or pattern: a regex)
#   workflow_strings         text inside any workflow file, on any branch
#   branch_names / branch_patterns   names of current branches, and of branches workflows ran on
#   runner_names             self-hosted runners registered to the repository
#   repository_names / repository_descriptions   repositories in the organisation
#   file_names               files anywhere in the default branch
#   commit_messages          messages of recent commits that changed workflows
#   action_commits           an action pinned (uses: or actions.lock) to one of these commits
#   exposure_window          the actions and time window when using them by tag ran the attackers' code
#   log_strings              text in workflow run logs (deep dive with --logs only)

updated: 2026-11-20
campaigns:
  - id: shai-hulud-1
    name: Shai-Hulud worm, first wave
    date: 2025-09-15
    sources:
      - https://www.stepsecurity.io/blog/ctrl-tinycolor-and-40-npm-packages-compromised
    workflow_files:
      - path: .github/workflows/shai-hulud-workflow.yml
    branch_names: [shai-hulud]
    repository_names: [Shai-Hulud]
    workflow_strings:
      - webhook.site/bb8ca5f6-4175-45d2-b042-fc9ebb8170b7

  - id: shai-hulud-2
    name: "Shai-Hulud 2.0 (Sha1-Hulud: The Second Coming)"
    date: 2025-11-24
    sources:
      - https://www.wiz.io/blog/shai-hulud-2-0-ongoing-supply-chain-attack
    workflow_files:
      - pattern: '^\.github/workflows/formatter_[0-9]+\.yml$'
      - path: .github/workflows/discussion.yaml
        only_if_contains: [self-hosted]
    branch_patterns: ['^add-linter-workflow-[0-9]+$']
    runner_names: [SHA1HULUD]
    repository_descriptions: ["Sha1-Hulud: The Second Coming", "Sha1-Hulud: The Continued Coming"]
    file_names: [setup_bun.js, bun_environment.js]

  - id: ghostaction-2025
    name: GhostAction (first wave)
    date: 2025-09-05
    sources:
      - https://blog.gitguardian.com/ghostaction-campaign-3-325-secrets-stolen/
    workflow_files:
      - path: .github/workflows/github_actions_security.yml
    workflow_strings:
      - bold-dhawan.45-139-104-115.plesk.page
      - objective-hopper.45-139-104-115.plesk.page
      - carte-avantage.com
      - 45.139.104.115
    commit_messages: [Add Github Actions Security workflow]

  - id: ghostaction-2026
    name: GhostAction (2026 waves)
    date: 2026-10-07
    sources:
      - https://blog.gitguardian.com/ghostaction-github-actions-supply-chain-attack-returns/
    workflow_files:
      - path: .github/workflows/github_actions_security.yml
      - path: .github/workflows/security-check.yml
        only_if_contains: [193.32.204.199, 170.39.218.2, oast.fun]
      - path: .github/workflows/security-audit.yml
        only_if_contains: [193.32.204.199, 170.39.218.2, oast.fun]
    workflow_strings: [193.32.204.199, 170.39.218.2]
    commit_messages: [Add Github Actions Security workflow, Update Github Actions Security workflow]

  - id: tj-actions-2025
    name: tj-actions/changed-files compromise (CVE-2025-30066)
    date: 2025-03-15
    sources:
      - https://github.com/advisories/ghsa-mrrh-fwg8-r2c3
    # GitHub has since removed the commit, so it can no longer be checked on GitHub itself
    action_commits:
      tj-actions/changed-files: [0e58ed8671d6b60d0890c21b07f8835ace038e67]
    log_strings:
      - gist.githubusercontent.com/nikitastupin/30e525b776c409e03c2d6f328f254965
      - B64_BLOB

  - id: reviewdog-2025
    name: reviewdog/action-setup compromise (CVE-2025-30154)
    date: 2025-03-19
    sources:
      - https://github.com/advisories/GHSA-qmg3-hpqr-gqvc
    action_commits:
      reviewdog/action-setup: [f0d342d24037bb11d26b9bd8496e0808ba32e9ec]
    exposure_window:
      from: "2025-03-11T18:42:00Z"
      to: "2025-03-11T20:31:00Z"
      actions: [reviewdog/action-setup, reviewdog/action-shellcheck, reviewdog/action-composite-template,
                reviewdog/action-staticcheck, reviewdog/action-ast-grep, reviewdog/action-typos]

